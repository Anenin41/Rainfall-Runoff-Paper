[paths]
project_root =
results_subdir = results/5p2_Horton_At_Rest/
figures_subdir = results/5p2_Horton_At_Rest/Figures/

[files]
summary_filename = recharge_swme_N1_horton_summary_history.csv
history_filename = recharge_swme_N1_horton_field_history.csv
hyper_summary_filename = recharge_hyperbolicity_summary.csv
hyper_history_filename = recharge_hyperbolicity_history.csv
case_tag = thesis_5p2

[output]
save_png = false
save_svg = true
save_pdf = true
png_dpi = 300
show_figures = false

[style]
use_titles = true
show_grid = true
line_width = 2.0
legend_font_size = 10
axis_font_size = 12
tick_font_size = 10

[snapshots]
snapshot_times = 
snapshot_time_fractions = 0.0, 0.25, 0.50, 0.75, 1.0

[hyperbolicity]
enabled = false
hyper_tol = 1e-10
heatmap_eps = 1e-16
use_log_heatmap = true
overlay_variable = a2

[plots]
# Defaults on: the general-purpose single-run plots (this config's default
# case is thesis §5.2, N=1, water-at-rest Horton infiltration). Hyperbolicity
# plots stay off since the thesis_5p2_horton_at_rest.ini config that produced
# this data has store_hyperbolicity = False (empty hyperbolicity CSVs).
plot_mean_height = true
plot_mean_velocity = true
plot_height_envelope = true
plot_height_snapshots = true
plot_velocity_snapshots = true
plot_moments = true
plot_hyper_max_imag_vs_time = false
plot_hyper_nonhyperbolic_cells_vs_time = false
plot_hyper_worst_x_vs_time = false
plot_hyper_heatmap = false
plot_hyper_binary_heatmap = false
plot_hyper_snapshots = false
plot_hyper_overlay = false

[comparison]
# Thesis §5.1: results/Ersoy/ErsoyData{0,1,2}/, paths relative to that
# directory (see plotter.py's main(), COMPARISON_DIR).
plot_alpha_comparison = true

alpha0_file = ErsoyData0/recharge_swme_N0_constant_field_history.csv
alpha1_file = ErsoyData1/recharge_swme_N0_constant_field_history.csv
alpha2_file = ErsoyData2/recharge_swme_N0_constant_field_history.csv

alpha0_label = $\alpha = 0$
alpha1_label = $\alpha = 1$
alpha2_label = $\alpha = 2$

filename = alpha_comparison_momentum_velocity

use_spatial_mean = true
x_target = 5.0