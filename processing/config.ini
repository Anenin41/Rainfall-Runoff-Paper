[paths]
project_root = 
results_subdir = processing/Ersoy/ErsoyData0/
figures_subdir = processing/Ersoy/

[files]
summary_filename = recharge_swme_N0_constant_alpha0_summary_history.csv
history_filename = recharge_swme_N0_constant_alpha0_field_history.csv
hyper_summary_filename = recharge_hyperbolicity_summary.csv
hyper_history_filename = recharge_hyperbolicity_history.csv
case_tag = Ersoy_N0

[output]
save_png = false
save_svg = true
save_pdf = true
png_dpi = 300
show_figures = false

[style]
use_titles = true
show_grid = true
line_width = 2.0
legend_font_size = 10
axis_font_size = 12
tick_font_size = 10

[snapshots]
snapshot_times = 
snapshot_time_fractions = 0.0, 0.25, 0.50, 0.75, 1.0

[hyperbolicity]
enabled = false
hyper_tol = 1e-10
heatmap_eps = 1e-16
use_log_heatmap = true
overlay_variable = a2

[plots]
plot_mean_height = false
plot_mean_velocity = false
plot_height_envelope = false
plot_height_snapshots = false
plot_velocity_snapshots = false
plot_moments = false
plot_hyper_max_imag_vs_time = false
plot_hyper_nonhyperbolic_cells_vs_time = false
plot_hyper_worst_x_vs_time = false
plot_hyper_heatmap = false
plot_hyper_binary_heatmap = false
plot_hyper_snapshots = false
plot_hyper_overlay = false

[comparison]
plot_alpha_comparison = true

alpha0_file = ErsoyData0/recharge_swme_N0_constant_alpha0_field_history.csv
alpha1_file = ErsoyData1/recharge_swme_N0_constant_alpha1_field_history.csv
alpha2_file = ErsoyData2/recharge_swme_N0_constant_alpha2_field_history.csv

alpha0_label = $\alpha = 0$
alpha1_label = $\alpha = 1$
alpha2_label = $\alpha = 2$

filename = alpha_comparison_momentum_velocity

use_spatial_mean = true
x_target = 5.0