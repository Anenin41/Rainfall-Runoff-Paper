[project]
name = "moment-sw"
version = "0.1.0"
description = "1D finite-volume solver for Shallow Water Moment Equations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "sympy>=1.13",
    "mpmath>=1.3",
    "pyyaml>=6.0",
    "dash>=3",
    "plotly>=6",
]

[project.scripts]
# Short names (swme/commands.py): with no argument they print their help.
experiment = "swme.commands:experiment"
report = "swme.commands:report"
visual = "swme.commands:visual"
docs = "swme.commands:docs"
help = "swme.commands:help"
purge = "swme.purge:main"
# Long aliases, unchanged: with no argument they run with their defaults.
moment-sw = "swme.cli:main"
moment-sw-report = "swme.report.cli:main"
moment-sw-view = "swme.viewer.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.uv]
# `uv run docs` needs mkdocs, so the docs group is installed by default.
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swme", "src/recharge"]
