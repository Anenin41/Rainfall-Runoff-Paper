[project]
name = "moment-sw"
version = "0.1.0"
description = "1D finite-volume solver for Shallow Water Moment Equations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "sympy>=1.13",
]

[project.scripts]
moment-sw = "moment_sw.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moment_sw"]