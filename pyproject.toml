[project]
name = "moment-sw"
version = "0.1.0"
description = "1D finite-volume solver for Shallow Water Moment Equations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "sympy>=1.13",
    "mpmath>=1.3",
    "pyyaml>=6.0",
]

[project.scripts]
moment-sw = "swme.cli:main"
purge = "swme.purge:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swme", "src/recharge"]
