# Forward-looking sketch of the YAML config schema (RESTRUCTURE_PLAN.md, decision #6).
#
# NOT YET CONSUMED BY ANY CODE. `main.py` still reads `config.ini` via `configparser`
# until the Step 7 `cli.py` rewrite, which is when the `yaml.safe_load`-based loader
# actually replaces it (see RESTRUCTURE_PLAN.md, Step 1.5 and Step 7). This file exists
# now so the intended structure/types are visible ahead of that rewrite, and mirrors
# config.ini's current active case (RechargeSWME1D, N=1, constant exfiltration).

pde:
  type: RechargeSWME1D          # SWME1D | RechargeSWME1D
  hyperbolic: false             # true selects the HSWME closure
  linear_source: false
  slip_length: 1.0
  viscosity: 1.0e-3

  # RechargeSWME1D-only fields:
  mixing_friction_model: admissible
  alpha_R: 1.0
  alpha_I: 1.0
  rainfall_rate: 1.0e-1
  infiltration_type: constant   # horton | constant
  constant_infiltration_rate: -5.0e-2
  constant_infiltration_eps: 1.0e-16
  constant_limit_by_rainfall: false
  constant_limit_by_available_water: true

  initial_condition: smooth_nested_profile_pulse_mild

grid:
  x1: 0.0
  x2: 2.0
  resolution_x: 300

numerics:
  order: 1
  t_end: 0.4
  method: classical
  fvm_type: PVM
  pvm: Roe                      # PRICE | LF | Roe | Osher
  time_integrator: ExplicitEuler
  boundary_condition: PERIODIC

postprocessing:
  output_dir: Data-processing/Results/Recharge
  store_history: true
  store_hyperbolicity: false
  history_stride: 1
  hyperbolicity_stride: 1
