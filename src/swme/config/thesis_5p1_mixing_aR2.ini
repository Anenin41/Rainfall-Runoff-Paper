# Thesis test case: 5.1 Rainfall-induced mixing-friction closure, alpha_R=2
# Reproduces the runtime parameters of Table 1 in the thesis.
# Run with:  uv run moment-sw --config thesis_5p1_mixing_aR2
[pde_information]
1D = True
pde_type = RechargeSWME1D
slipLength = 1.0
viscosity = 0.0
linear_source = False
hyperbolic = False
initialCondition = constantHeight_constantVelocity
mixing_friction_model = admissible
alpha_R = 2.0
alpha_I = 0.0
rainfall_rate = 1.0
infiltration_type = constant
constant_infiltration_rate = 0.0
constant_limit_by_rainfall = False
constant_limit_by_available_water = False

[grid_information]
structuredGrid = True
resolutionX = 400
x1boundary = 0.0
x2boundary = 10.0

[numerical_method_information]
t_end = 1.0
method = classical
order = 0
fvm_type = PVM
pvm = Roe
timeIntegrator = ExplicitEuler
boundaryCondition = PERIODIC

[postprocessing]
store_history = True
store_hyperbolicity = False
history_stride = 1
hyperbolicity_stride = 1
