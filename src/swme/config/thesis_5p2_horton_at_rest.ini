# Thesis test case: 5.2 Horton infiltration under constant rainfall (water at rest)
# Reproduces the runtime parameters of Table 2 in the thesis.
# Run with:  uv run moment-sw --config thesis_5p2_horton_at_rest
[pde_information]
1D = True
pde_type = RechargeSWME1D
slipLength = 1.0
viscosity = 0.0
linear_source = False
hyperbolic = False
initialCondition = constantHeight_noVelocity
mixing_friction_model = admissible
alpha_R = 0.0
alpha_I = 0.0
rainfall_rate = 1.0e-3
infiltration_type = horton
horton_f0 = 1.2e-3
horton_fc = 7.0e-4
horton_k = 1.0e-3

[grid_information]
structuredGrid = True
resolutionX = 10
x1boundary = 0.0
x2boundary = 1.0

[numerical_method_information]
t_end = 1800.0
method = classical
order = 1
fvm_type = PVM
pvm = Roe
timeIntegrator = ExplicitEuler
boundaryCondition = PERIODIC

[postprocessing]
store_history = True
store_hyperbolicity = False
history_stride = 1
hyperbolicity_stride = 1
