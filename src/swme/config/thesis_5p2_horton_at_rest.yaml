# Thesis test case: 5.2 Horton infiltration under constant rainfall (water at rest)
# Reproduces the runtime parameters of Table 2 in the thesis.
# Run with:  uv run moment-sw --config thesis_5p2_horton_at_rest

pde:
  type: RechargeSWME1D
  slip_length: 1.0
  viscosity: 0.0
  linear_source: false
  hyperbolic: false
  initial_condition: constantHeight_noVelocity
  mixing_friction_model: admissible
  alpha_R: 0.0
  alpha_I: 0.0
  rainfall_rate: 1.0e-3
  infiltration_type: horton
  horton_f0: 1.2e-3
  horton_fc: 7.0e-4
  horton_k: 1.0e-3

grid:
  resolution_x: 10
  x1: 0.0
  x2: 1.0

numerics:
  t_end: 1800.0
  method: classical
  order: 1
  fvm_type: PVM
  pvm: Roe
  time_integrator: ExplicitEuler
  boundary_condition: PERIODIC

postprocessing:
  store_history: true
  store_hyperbolicity: false
  history_stride: 1
  hyperbolicity_stride: 1
