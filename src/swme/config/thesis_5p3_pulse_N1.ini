# Thesis test case: 5.3 Symmetric constant rainfall-exfiltration pulse, N=1
# Reproduces the runtime parameters of Table 3 in the thesis.
# Run with:  uv run moment-sw --config thesis_5p3_pulse_N1
[pde_information]
1D = True
pde_type = RechargeSWME1D
slipLength = 1.0
viscosity = 1e-3
linear_source = False
hyperbolic = False
initialCondition = smooth_nested_profile_pulse_mild
mixing_friction_model = admissible
alpha_R = 1.0
alpha_I = 1.0
rainfall_rate = 0.1
infiltration_type = constant
constant_infiltration_rate = -0.1
constant_limit_by_rainfall = False
constant_limit_by_available_water = False

[grid_information]
structuredGrid = True
resolutionX = 450
x1boundary = 0.0
x2boundary = 3.0

[numerical_method_information]
t_end = 1.0
method = classical
order = 1
fvm_type = PVM
pvm = Roe
timeIntegrator = ExplicitEuler
boundaryCondition = PERIODIC

[postprocessing]
store_history = True
store_hyperbolicity = False
history_stride = 1
hyperbolicity_stride = 1
