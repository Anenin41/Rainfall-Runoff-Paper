# Thesis test case: 5.4 Mild periodic Horton pulse, N=2
# Reproduces the runtime parameters of Table 4 in the thesis.
# Run with:  uv run moment-sw --config thesis_5p4_horton_N2
[pde_information]
1D = True
pde_type = RechargeSWME1D
slipLength = 1.0
viscosity = 1e-3
linear_source = False
hyperbolic = False
initialCondition = smooth_nested_profile_pulse_aggressive
mixing_friction_model = admissible
alpha_R = 1.0
alpha_I = 0.0
rainfall_rate = 0.2
infiltration_type = horton
horton_f0 = 0.24
horton_fc = 0.14
horton_k = 1.0

[grid_information]
structuredGrid = True
resolutionX = 450
x1boundary = 0.0
x2boundary = 1.0

[numerical_method_information]
t_end = 1.8
method = classical
order = 2
fvm_type = PVM
pvm = Roe
timeIntegrator = ExplicitEuler
boundaryCondition = PERIODIC

[postprocessing]
store_history = True
store_hyperbolicity = False
history_stride = 1
hyperbolicity_stride = 1
