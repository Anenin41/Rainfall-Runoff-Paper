# Well-balancing benchmark: a lake at rest over a Gaussian bump.
#
# The C-property test of RESTRUCTURE_PLAN.md Step 5. A flat free surface
# h + Z = 2 over a non-flat bed, at rest, must stay at rest to machine
# precision: the augmented (U, Z) path-conservative coupling makes the
# interface fluctuations vanish identically. Any visible motion in the output
# is a bug, not a physical result.
#
# Note `pvm = Roe`: LF and PRICE are NOT well balanced over topography (their
# numerical viscosity has a nonzero constant term), and the solver warns if you
# select one here. See spatialDiscretization.SpatialDiscretization.
#
# Run with:  uv run moment-sw --config topography_lake_at_rest

pde:
  type: SWME1D
  slip_length: 1.0
  viscosity: 0.0
  linear_source: false
  hyperbolic: false
  initial_condition: lakeAtRest

grid:
  resolution_x: 100
  x1: 0.0
  x2: 1.0

numerics:
  t_end: 1.0
  method: classical
  order: 1
  fvm_type: PVM
  pvm: Roe
  time_integrator: ExplicitEuler
  boundary_condition: INFLOW_OUTFLOW

topography:
  bed_profile: gaussian_bump
  amplitude: 0.4
  center: 0.5
  width: 0.1
  reference_water_level: 2.0
