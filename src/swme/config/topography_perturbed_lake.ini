# Perturbation of a lake at rest over a Gaussian bump.
#
# The standard follow-up to the C-property test (see
# topography_lake_at_rest.ini): the same bed and the same still lake, plus a
# small Gaussian bump on the free surface. A well-balanced scheme lets that
# perturbation propagate and interact with the bed while generating no spurious
# waves of its own - the free-surface deviation must stay of the order of the
# perturbation amplitude (1e-3 here), not of the bed amplitude (0.4).
#
# Run with:  uv run moment-sw --config topography_perturbed_lake
[pde_information]
1D = True
pde_type = SWME1D
slipLength = 1.0
viscosity = 0.0
linear_source = False
hyperbolic = False
initialCondition = perturbedLakeAtRest

[topography]
bed_profile = gaussian_bump
amplitude = 0.4
center = 0.5
width = 0.1
reference_water_level = 2.0
perturbation_amplitude = 1.0e-3
perturbation_center = 0.15
perturbation_width = 0.03

[grid_information]
structuredGrid = True
resolutionX = 200
x1boundary = 0.0
x2boundary = 1.0

[numerical_method_information]
t_end = 0.5
method = classical
order = 1
fvm_type = PVM
pvm = Roe
timeIntegrator = ExplicitEuler
boundaryCondition = INFLOW_OUTFLOW
