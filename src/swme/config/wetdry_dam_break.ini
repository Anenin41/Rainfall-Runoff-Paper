# Wet-dry benchmark: dam break onto a completely dry bed.
#
# The canonical test for RESTRUCTURE_PLAN.md Step 6. A column of water at rest
# on x < 0 is released onto an exactly-dry bed (h = 0, not a thin film) on
# x > 0. Before Step 6 this configuration could not be run at all: the solver
# raised RuntimeError the instant any cell height reached zero.
#
# What to look for: the wet front advances at the Ritter speed 2*sqrt(g*h0),
# no cell ever goes negative, and total mass is conserved to round-off.
#
# NOTE the [wet_dry] thresholds below are far tighter than the package
# defaults (h_dry = 1e-4, h_wet = 1e-3), and deliberately so. A vacuum front
# is the one case where the exact solution itself contains arbitrarily small
# depths: Ritter's h vanishes quadratically at the front, so any fixed h_dry
# truncates the leading edge and slows the front down. Measured front speed at
# 800 cells against the exact 2.000:
#
#     h_dry = 1e-4  ->  1.758   (12% too slow)
#     h_dry = 1e-8  ->  1.934   ( 3% too slow)
#     h_dry = 1e-10 ->  1.971   ( 1% too slow)
#
# The trade-off runs the other way as soon as there is friction: h_dry also
# floors the nu/h^2 viscous term, so shrinking it to 1e-10 with a nonzero
# viscosity would let that term reach nu*1e20. This case is inviscid, so there
# is no such penalty here. Rule of thumb: put h_dry well below the smallest
# depth you need to resolve, then check that nu/h_dry^2 is still sane.
#
# Run with:  uv run moment-sw --config wetdry_dam_break
[pde_information]
1D = True
pde_type = SWME1D
slipLength = 1.0
viscosity = 0.0
linear_source = False
hyperbolic = False
initialCondition = damBreak_dryBed

[wet_dry]
h_dry = 1.0e-10
h_wet = 1.0e-9
eps_div = 1.0e-14

[grid_information]
structuredGrid = True
resolutionX = 200
x1boundary = -1.0
x2boundary = 1.0

[numerical_method_information]
t_end = 0.2
method = classical
order = 1
fvm_type = PVM
pvm = Roe
timeIntegrator = ExplicitEuler
boundaryCondition = INFLOW_OUTFLOW
